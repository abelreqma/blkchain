<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-labelledby="title description">
<title id="title">blkChain System Map</title><desc id="description">Hybrid Qdrant search and live web searches (opt-in) supply cited context. Go applies RoE scope and action limits before isolated workers, web and API execution, foothold pivots, and offline scans across network, web, Active Directory, cloud, local, container, Kubernetes, and AI application surfaces. SQLite stores evidence and review state.</desc>
