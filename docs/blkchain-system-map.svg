<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 664" width="1120" height="664" role="img" aria-labelledby="title description">
<title id="title">blkChain System Map</title><desc id="description">Five entry points, blk ask, the REPL and TUI, blk mcp, blk serve and blk engage, share one Go control plane. A native turn routes through router and assessment models with failover, and the caller's vantage decides which tools may reach the host. Hybrid Qdrant search and live web searches supply cited context. Go applies RoE scope, action limits and service evidence before isolated workers, the scoped web and API broker, gated Burp and interactsh instruments, foothold pivots, and offline scans across network, web, Active Directory, cloud, local, container, Kubernetes, and AI application surfaces. SQLite stores evidence and review state.</desc>
