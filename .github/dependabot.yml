version: 2

# Does not move the go directive, the analyzer versions in run: steps, or the apk digests.

updates:
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      gomod:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # langchaingo past 0.1.13 sanitizes network errors, severing the chain mapLLMError matches on.
    ignore:
      - dependency-name: "github.com/tmc/langchaingo"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Whether the root entry reaches the local actions is undocumented; the glob covers them.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/cli/runner"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
