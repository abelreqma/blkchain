version: 2

# Pins this does not move, because none of them is a manifest entry:
#
# - The `go` directive in cli/go.mod. govulncheck.yml covers that class.
# - The analyzer versions in the workflow `run:` steps.
# - The apk digests in cli/runner/packages-*.lock, which gen-lock.sh writes.

updates:
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      gomod:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The root entry reads .github/workflows. Whether it also reaches the local
  # actions is undocumented, so the glob covers them either way.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/cli/runner"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
