name: pip-audit

# Vulnerability scanning for the Python dependencies, read from uv.lock.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The event is in the group so a scheduled and a push run do not cancel each other.
concurrency:
  group: pip-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/uv
      - name: pip-audit
        # --disable-pip requires the hashed requirements the export produces by default.
        run: |
          uv export --locked --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.9.0 --requirement "$RUNNER_TEMP/requirements.txt" --disable-pip
