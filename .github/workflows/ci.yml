name: ci

# The hermetic suites and the static checks. The opt-in browser, runner, MCP and
# local-model suites need provisioned services or a local model and do not run
# here; they stay behind their own environment gates.
#
# Vulnerability scanning is in govulncheck.yml and pip-audit.yml, which also run
# on a schedule so an advisory published against an already pinned dependency is
# caught without a commit.
#
# The Go and Python jobs run on macOS: the embedding service targets MLX on
# Apple Silicon, and the runner and command tests in cli skip when GOOS is not
# darwin, so a linux runner would report a pass it never executed. The git-only
# jobs have no platform dependency and run on linux.
#
# Third-party actions are pinned to a commit SHA rather than a tag, so a moved
# tag cannot change what runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - name: gofmt
        working-directory: cli
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        working-directory: cli
        run: go vet ./...
      - name: test
        working-directory: cli
        run: go test ./...

  go-analysis:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      # v0.8.1 reads export data version 4; the toolchain cli/go.mod requires emits 5.
      - name: staticcheck
        working-directory: cli
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45 ./...

  go-race:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      # The skipped test builds the CLI in 45s, needing the warm plain cache -race lacks.
      - name: test with the race detector
        working-directory: cli
        run: go test -race -skip '^TestCredentialFindingFromRealCLIAndParserWorker$' ./...

  python:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/uv
      - name: install the pinned interpreter and dependencies
        run: |
          uv python install
          uv sync --locked
      - name: test
        run: .venv/bin/python -m unittest discover tests

  # ruff needs no project environment, so this job installs no interpreter or deps.
  python-analysis:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/uv
      - name: ruff
        run: uvx ruff@0.14.3 check blkchain tests

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # actionlint accepts a relative action path that does not exist.
      - name: every local action reference resolves
        shell: bash
        run: |
          set -u

          # Anchored so a comment naming the key is not read as a reference.
          key='^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*\./'
          status=0
          grep -rhE "$key" .github/workflows .github/actions > refs.txt || status=$?
          if [ "$status" -gt 1 ]; then
            echo "grep failed with status $status"
            exit 1
          fi

          : > missing.txt
          while read -r path; do
            if [ ! -f "$path/action.yml" ] && [ ! -f "$path/action.yaml" ]; then
              echo "$path" >> missing.txt
            fi
          done < <(sed -E 's|^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*||; s|[[:space:]].*$||' refs.txt | sort -u)

          if [ -s missing.txt ]; then
            echo "these local action references do not resolve:"
            cat missing.txt
            exit 1
          fi

  runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the isolated runner image
        working-directory: cli/runner
        run: docker build --tag blkchain-runner:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: no secret-shaped strings in history
        shell: bash
        run: |
          set -u

          pattern='sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|tvly-[A-Za-z0-9]{10,}|AIza[0-9A-Za-z_-]{35}|(AKIA|ASIA)[0-9A-Z]{16}|BEGIN [A-Z0-9 ]*PRIVATE KEY'

          # The credential detectors under cli/internal/webanalysis and the
          # transcript redaction tests carry synthetic fixtures: the AWS
          # documentation key, a sequential placeholder, and PEM headers whose
          # body decodes to "fixture". A hit is exempt only when its path and
          # its matched text both appear below, so a real credential in one of
          # these same files still fails. This file lists the values and so
          # matches the pattern itself.
          printf '%s\n' \
            .github/workflows/ci.yml \
            cli/cloudexec_test.go \
            cli/engagetranscript_test.go \
            cli/internal/secgate/foothold_test.go \
            cli/internal/webanalysis/config_credentials_test.go \
            cli/toolcatalog_e2e_test.go \
            cli/webfinding_integration_test.go > allowed-paths.txt
          printf '%s\n' \
            AKIAIOSFODNN7EXAMPLE \
            ASIAABCDEFGHIJKLMNOP \
            'BEGIN OPENSSH PRIVATE KEY' \
            'BEGIN PRIVATE KEY' > allowed-values.txt

          git rev-list --all > commits.txt
          if [ ! -s commits.txt ]; then
            echo "git rev-list --all produced no commits"
            exit 1
          fi

          # git grep reports 0 for a match, 1 for no match and above 1 for a
          # failure. A failure exits here rather than reading as a clean
          # history. The commit list is chunked so the argument list cannot
          # overflow as history grows.
          : > hits.txt
          while read -r -a chunk; do
            if [ "${#chunk[@]}" -eq 0 ]; then
              continue
            fi
            status=0
            git grep -oI -E "$pattern" "${chunk[@]}" >> hits.txt || status=$?
            if [ "$status" -gt 1 ]; then
              echo "git grep failed with status $status"
              exit 1
            fi
          done < <(xargs -n 256 echo < commits.txt)

          hits=$(sed 's/^[0-9a-f]*://' hits.txt | sort -u | awk '
            FILENAME == "allowed-paths.txt"  { paths[$0] = 1; next }
            FILENAME == "allowed-values.txt" { values[$0] = 1; next }
            {
              sep = index($0, ":")
              path = substr($0, 1, sep - 1)
              value = substr($0, sep + 1)
              if (!(path in paths) || !(value in values)) {
                print
              }
            }
          ' allowed-paths.txt allowed-values.txt -)
          if [ -n "$hits" ]; then
            echo "secret-shaped strings outside the known fixtures:"
            echo "$hits"
            exit 1
          fi

  local-only-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: no local-only agent paths are tracked
        # The directories agent tooling writes into are local to a machine and
        # are kept out by ignore rules. Those rules live outside the repository,
        # so they do not reach a clone that has not been configured. This fails
        # the build instead, which covers every clone.
        shell: bash
        run: |
          set -u

          pattern='(^|/)(\.claude|\.deepeval)/|handoff'

          # grep reports 1 for no match, which is the passing case, and above 1
          # for a failure. A failure exits rather than reading as a clean tree.
          git ls-files > tracked-files.txt
          status=0
          tracked=$(grep -iE "$pattern" tracked-files.txt) || status=$?
          if [ "$status" -gt 1 ]; then
            echo "grep failed with status $status"
            exit 1
          fi
          if [ -n "$tracked" ]; then
            echo "these paths are local-only and must not be tracked:"
            echo "$tracked"
            exit 1
          fi
