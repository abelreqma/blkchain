name: "Go toolchain"
description: "Installs the Go toolchain cli/go.mod requires and restores the module cache."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: cli/go.mod
        cache-dependency-path: cli/go.sum
