name: "Go toolchain"
description: "Installs the Go toolchain cli/go.mod requires and restores the module cache."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: cli/go.mod
        cache-dependency-path: cli/go.sum
