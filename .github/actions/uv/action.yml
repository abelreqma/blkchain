name: "uv"
description: "Installs the pinned uv release, which supplies the interpreter and the tool environments."

# setup-python has no macOS arm64 build for the version .python-version pins.

runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.12.16"
