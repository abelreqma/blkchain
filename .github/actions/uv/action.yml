name: "uv"
description: "Installs the pinned uv release, which supplies the interpreter and the tool environments."

# setup-python has no 3.12.14 build for macOS on arm64, so it cannot install the
# version .python-version pins. uv supplies that interpreter itself.

runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.16"
