[project]
name = "blkchain"
version = "0.1.0"
description = "Local offensive-security hybrid agentic RAG (Apple Silicon / oMLX)."
requires-python = ">=3.12,<3.13"
dependencies = [
  # chunking (the only LangChain package used; pulls langchain-core only)
  "langchain-text-splitters==1.1.3",
  # vector store + sparse (BM25 via FastEmbed)
  "qdrant-client==1.19.1",
  "fastembed==0.9.0",
  # local MLX embedder + reranker serving
  "mlx-embeddings==0.1.0",
  "mlx-lm==0.32.0",
  # LLM client (eval judge), tokenization, PDF
  "openai==3.26.0",
  "tiktoken==0.14.0",
  "pypdf==6.19.0",
  "requests==2.34.2",
  "numpy==2.5.3",
  "transformers==5.17.0",  # tokenizer-only (reranker); no torch
  # evaluation
  "deepeval==4.2.8",
  # Tavily client, kept for operator use; the web search path is Go and calls the HTTP API.
  "tavily-python==0.8.5",
]

# Secrets are read from the environment.
# uv.lock pins transitive dependencies and artifact hashes.

[tool.uv]
package = false

[tool.ruff.lint]
# E501 disagrees with the wrap width this project uses.
select = ["E", "F", "W", "C4"]
ignore = ["E501"]
